services:
  # ─────────────────────────────────────────────────────────
  # BACKEND  —  Python / Flask / Gunicorn
  # ─────────────────────────────────────────────────────────
  - type: web
    name: cinestream-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    plan: free
    envVars:
      - key: TMDB_API_KEY
        sync: false          # You will set this manually in Render dashboard
      - key: CORS_ORIGINS
        sync: false          # Set to your frontend URL after deploying frontend
      - key: PYTHON_VERSION
        value: "3.11.0"

  # ─────────────────────────────────────────────────────────
  # FRONTEND  —  React (Static Site)
  # ─────────────────────────────────────────────────────────
  - type: web
    name: cinestream-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        sync: false          # Set to your backend URL (e.g. https://cinestream-backend.onrender.com)
      - key: NODE_VERSION
        value: "20.11.0"
